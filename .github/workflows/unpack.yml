name: Unpack dashboard files
on:
  push:
    paths: ['.github/workflows/unpack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into the repo and remove the zip
        run: |
          unzip -q outbound-floor-dashboard.zip -d /tmp/u
          rsync -a --exclude .git /tmp/u/outbound-floor-dashboard/ ./
          git rm -q outbound-floor-dashboard.zip .github/workflows/unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack dashboard files from zip"
          git push
